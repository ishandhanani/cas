# SPDX-License-Identifier: Apache-2.0

schema_version = 2
agent = "codex"
seed = 42

[load]
root_sessions = 16
concurrent_agents = 8
startup_interval_ms = 0
restart_delay_ms = { kind = "fixed", value = 0 }

[trajectory]
turns = { kind = "uniform", min = 4, max = 12 }
think_time_ms = { kind = "log_normal", median = 750.0, sigma = 0.8, min = 25, max = 15000 }
output_tokens = { kind = "log_normal", median = 450.0, sigma = 0.9, min = 16, max = 4096 }

[tokens]
block_size = 16
system_prefix_tokens = { kind = "fixed", value = 11000 }
tool_catalog_tokens = { kind = "fixed", value = 9000 }
repository_tokens = { kind = "log_normal", median = 2000.0, sigma = 0.7, min = 256, max = 12000 }
session_tokens = { kind = "uniform", min = 128, max = 1024 }
user_tokens = { kind = "log_normal", median = 180.0, sigma = 0.9, min = 16, max = 4096 }
tool_result_tokens = { kind = "log_normal", median = 700.0, sigma = 1.1, min = 16, max = 16384 }
context_window_tokens = 128000

[behavior]
tool_probability = 0.50
parallel_tool_probability = 0.08
subagent_probability = 0.08
swarm_probability = 0.025
completion_probability = 0.10
background_request_probability = 0.03

[compaction]
enabled = true
trigger_fraction = 0.78
summary_input_tokens = { kind = "uniform", min = 256, max = 1024 }
summary_output_tokens = { kind = "uniform", min = 512, max = 2048 }
retained_recent_tokens = 8192
abort_probability = 0.0
retry_probability = 0.0
max_attempts = 3
abort_after_ms = { kind = "fixed", value = 10 }

[subagents]
max_depth = 2
turns = { kind = "uniform", min = 2, max = 5 }
fanout = { kind = "uniform", min = 2, max = 4 }
spawn_delay_ms = { kind = "uniform", min = 5, max = 100 }
blocking_probability = 0.72

[tools]
parallel_count = { kind = "uniform", min = 2, max = 4 }
retry_probability = 0.35

[[tools.classes]]
name = "read"
weight = 0.27
latency_ms = { kind = "log_normal", median = 120.0, sigma = 0.8, min = 40, max = 350 }
result_tokens = { kind = "log_normal", median = 500.0, sigma = 1.0, min = 128, max = 2000 }
error_probability = 0.01

[[tools.classes]]
name = "search"
weight = 0.21
latency_ms = { kind = "log_normal", median = 250.0, sigma = 0.9, min = 80, max = 900 }
result_tokens = { kind = "log_normal", median = 900.0, sigma = 1.0, min = 128, max = 4000 }
error_probability = 0.03

[[tools.classes]]
name = "shell"
weight = 0.21
latency_ms = { kind = "log_normal", median = 600.0, sigma = 1.0, min = 100, max = 2500 }
result_tokens = { kind = "log_normal", median = 1200.0, sigma = 1.1, min = 64, max = 8000 }
error_probability = 0.08

[[tools.classes]]
name = "patch"
weight = 0.13
latency_ms = { kind = "log_normal", median = 500.0, sigma = 0.9, min = 120, max = 1800 }
result_tokens = { kind = "log_normal", median = 700.0, sigma = 0.9, min = 64, max = 3000 }
error_probability = 0.05

[[tools.classes]]
name = "network"
weight = 0.08
latency_ms = { kind = "log_normal", median = 1500.0, sigma = 1.0, min = 300, max = 5000 }
result_tokens = { kind = "log_normal", median = 1800.0, sigma = 1.2, min = 128, max = 12000 }
error_probability = 0.10

[[tools.classes]]
name = "orchestration"
weight = 0.10
latency_ms = { kind = "log_normal", median = 80.0, sigma = 0.7, min = 20, max = 250 }
result_tokens = { kind = "log_normal", median = 128.0, sigma = 0.7, min = 32, max = 512 }
error_probability = 0.03

[limits]
max_nodes = 10000
max_sessions = 1000
max_total_input_tokens = 250000000
