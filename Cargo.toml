[workspace]
members = [".", "crates/core", "crates/trace", "crates/generate", "crates/replay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA-dev/agent-loadgen"

[package]
name = "agent-loadgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "KV-faithful trace replay and generated coding-agent load for Dynamo"
readme = "README.md"
repository.workspace = true
publish = false

[dependencies]
agent-loadgen-core = { version = "0.1.0", path = "crates/core", features = ["clap"] }
agent-loadgen-generate = { version = "0.1.0", path = "crates/generate" }
agent-loadgen-replay = { version = "0.1.0", path = "crates/replay", features = ["clap"] }
agent-loadgen-trace = { version = "0.1.0", path = "crates/trace" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
