[package]
name = "agent-loadgen"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "KV-shape and timing replay for Dynamo request traces"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
