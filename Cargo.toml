[package]
name = "agent-loadgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "KV-faithful trace replay and generated coding-agent load for Dynamo"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
hdrhistogram = "7"
hf-hub = { version = "0.4.2", default-features = false, features = ["rustls-tls", "ureq"] }
hex = "0.4"
libc = "0.2"
json-five = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rand = "0.9"
rand_distr = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokenizers = { version = "0.21.4", default-features = false, features = ["esaxx_fast", "onig", "rustls-tls"] }
toml = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
