[package]
name = "agent-loadgen-trace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dynamo request trace ingestion and causal lowering for agent-loadgen"
repository.workspace = true
publish = false

[dependencies]
agent-loadgen-core = { version = "0.1.0", path = "../core" }
anyhow = "1"
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
