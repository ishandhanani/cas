description = "Shared contracts and scheduling primitives for agent-loadgen"
repository.workspace = true
publish = false

[features]
clap = ["dep:clap"]

[dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
