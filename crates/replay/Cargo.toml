[package]
name = "agent-loadgen-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Causal replay runtime and transport for agent-loadgen"
repository.workspace = true
publish = false

[features]
clap = ["dep:clap"]

[dependencies]
agent-loadgen-core = { version = "0.1.0", path = "../core" }
agent-loadgen-generate = { version = "0.1.0", path = "../generate" }
agent-loadgen-trace = { version = "0.1.0", path = "../trace" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"], optional = true }
futures-util = "0.3"
hdrhistogram = "7"
hf-hub = { version = "0.4.2", default-features = false, features = ["rustls-tls", "ureq"] }
hex = "0.4"
json-five = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokenizers = { version = "0.21.4", default-features = false, features = ["onig"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
toml = "0.9"
